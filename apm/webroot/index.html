<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SpoofUname</title>
</head>

<body>

    <main class="app">
        <header class="app-header">
            <h1 class="md-typescale-headline-medium">SpoofUname</h1>
            <p class="md-typescale-body-medium app-subtitle">内核 Uname 信息伪装控制面板</p>
        </header>

        <!-- 状态卡：模块总开关 + 当前生效的 uname -->
        <section class="card" aria-labelledby="status-title">
            <div class="card-head">
                <svg class="card-icon" aria-hidden="true"><use href="#i-shield" /></svg>
                <h2 id="status-title" class="md-typescale-title-medium">模块状态</h2>
                <md-assist-chip id="statusChip" class="status-chip" label="加载中…">
                    <svg slot="icon" class="chip-icon" aria-hidden="true"><use id="statusChipIcon" href="#i-check" /></svg>
                </md-assist-chip>
            </div>

            <div class="row row-switch">
                <div class="row-text">
                    <span class="md-typescale-body-large">启用 Uname 伪装</span>
                    <span class="md-typescale-body-small row-desc">关闭后立即恢复真实信息</span>
                </div>
                <md-switch id="moduleSwitch" aria-label="模块开关"></md-switch>
            </div>

            <md-divider></md-divider>

            <div class="uname-current">
                <div class="uname-line">
                    <span class="uname-key md-typescale-label-medium">RELEASE</span>
                    <span class="uname-val md-typescale-body-medium" id="curRelease">—</span>
                </div>
                <div class="uname-line">
                    <span class="uname-key md-typescale-label-medium">VERSION</span>
                    <span class="uname-val md-typescale-body-medium" id="curVersion">—</span>
                </div>
            </div>
        </section>

        <!-- 配置卡：输入要伪装的 release / version -->
        <section class="card" aria-labelledby="config-title">
            <div class="card-head">
                <svg class="card-icon" aria-hidden="true"><use href="#i-edit" /></svg>
                <h2 id="config-title" class="md-typescale-title-medium">伪装配置</h2>
            </div>

            <md-outlined-text-field id="release" label="Release (uname -r)" type="text"
                placeholder="例如: 6.1.114514" supporting-text="失焦后自动应用并保存"></md-outlined-text-field>
            <md-outlined-text-field id="version" label="Version (uname -v)" type="text"
                placeholder="例如: #1 SMP PREEMPT ..." supporting-text="失焦后自动应用并保存"></md-outlined-text-field>

            <div class="button-group">
                <md-outlined-button id="getUnameBtn">
                    <svg class="btn-icon" slot="icon" aria-hidden="true"><use href="#i-terminal" /></svg>
                    获取 Uname
                </md-outlined-button>
                <md-outlined-button id="refreshStatusBtn">
                    <svg class="btn-icon" slot="icon" aria-hidden="true"><use href="#i-refresh" /></svg>
                    刷新状态
                </md-outlined-button>
            </div>

            <pre class="output" id="unameOutput" hidden></pre>
        </section>

        <!-- 选项卡：开机自启 -->
        <section class="card" aria-labelledby="options-title">
            <div class="card-head">
                <svg class="card-icon" aria-hidden="true"><use href="#i-settings" /></svg>
                <h2 id="options-title" class="md-typescale-title-medium">选项</h2>
            </div>

            <div class="row row-switch">
                <div class="row-text">
                    <span class="md-typescale-body-large">开机自启</span>
                    <span class="md-typescale-body-small row-desc">重启后自动重放配置（需嵌入 KPM）</span>
                </div>
                <md-switch id="autoStartSwitch" selected aria-label="开机自启"></md-switch>
            </div>
        </section>

        <!-- 日志卡：默认折叠 -->
        <section class="card" aria-labelledby="log-title">
            <div class="card-head">
                <button class="log-toggle" id="logToggle" aria-expanded="false" aria-controls="logDisplay">
                    <svg class="card-icon" aria-hidden="true"><use href="#i-log" /></svg>
                    <h2 id="log-title" class="md-typescale-title-medium">操作日志</h2>
                    <svg class="log-caret" aria-hidden="true"><use href="#i-chevron" /></svg>
                </button>
                <md-icon-button id="clearLogBtn" aria-label="清除日志" title="清除日志">
                    <svg class="icon-btn-glyph" aria-hidden="true"><use href="#i-trash" /></svg>
                </md-icon-button>
            </div>
            <pre class="output log-display" id="logDisplay" hidden></pre>
        </section>
    </main>

    <div class="progress-overlay" id="progressOverlay" hidden>
        <md-circular-progress indeterminate></md-circular-progress>
    </div>

    <div class="snackbar md-typescale-body-medium" id="snackbar" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
