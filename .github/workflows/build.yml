name: Build

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Generate version
        id: parse_version
        run: |
          FULL_VER=$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)
          echo "VERSION=$FULL_VER" >> $GITHUB_OUTPUT
          echo "Generated Version: $FULL_VER"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git zip unzip wget
          cd ~
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip android-ndk-r27d-linux.zip
          echo "ANDROID_NDK=$HOME/android-ndk-r27d/" >> $GITHUB_ENV

      - name: Build all
        run: |
          make clean
          make all

      - name: Release to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ci-build
          name: SpoofUname CI Build
          artifacts: |
            build/SpoofUname_APM_*.zip
            build/SpoofUname_KPM_v*.kpm
            build/SpoofUname_KPM_debug_*.kpm
          generateReleaseNotes: false
          body: |
            Latest CI build from main branch.
            Commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true

      - name: Upload artifacts (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/SpoofUname_APM_*.zip
            build/SpoofUname_KPM_v*.kpm
            build/SpoofUname_KPM_debug_*.kpm
